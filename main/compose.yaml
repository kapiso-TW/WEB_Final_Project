
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volleyball_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: volleyball_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: volleyball_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: volleyball
      MYSQL_USER: volleyball_app
      MYSQL_PASSWORD: volleyball_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  node:
    image: node:22-alpine
    container_name: volleyball_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  dbdata:
